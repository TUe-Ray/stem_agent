genome_version: 2
name: toy_structured_answer_zero_order_seed
scenario_name: toy_structured_answer
task_diagnosis:
  expected_task_solving_pattern: Interpret the scenario description and constraints
    to generate a structured JSON answer that addresses the request without requiring
    further clarifications, focusing on actionable and relevant content.
  initial_architecture_hypothesis: A language model-based agent that parses scenario
    inputs to identify task type, constraints, and required outputs, then generates
    corresponding structured responses directly.
  initial_evaluation_hypothesis: Successful outputs will conform to the requested
    structured format, avoid unnecessary clarifications, and produce actionable information
    consistent with scenario details.
  likely_failure_modes:
  - Asking unnecessary clarification questions
  - Producing vague or unstructured responses
  - Ignoring constraints about actionability
  - Misinterpreting the scenario context or requirements
  likely_needed_capabilities:
  - Natural language understanding
  - Structured data generation
  - Constraint adherence
  - Scenario interpretation
  task_type: general structured response generation
roles:
- name: solver
  description: Fresh task solver created without relying on the prior genome shape.
  instructions: Solve the problem from the scenario description. Show useful intermediate
    work and give the final answer.
  allowed_tools:
  - call_model
- name: StrategyAuditor
  description: Looks for a new class of mutation when ordinary edits stall.
  instructions: Identify the weakest case pattern and force the final response to
    address it explicitly.
  allowed_tools:
  - call_model
workflow:
- id: solve_from_scratch
  role: solver
  action: Solve the task from scratch using the scenario input and fixed evaluation
    criteria.
  input_from: []
  output_key: final_output
- id: audit_strategy_shift
  role: StrategyAuditor
  action: Audit the current solving strategy and add one concrete correction before
    final output.
  input_from:
  - solve_from_scratch
  output_key: strategy_audit
tools:
  builtin:
  - call_model
  generated: []
memory:
  schema:
    notes: string
  type: ephemeral
quality_gates: []
self_evaluation:
  enabled: true
  rubric:
  - Must include a short summary
  - Must include concrete steps
  - Must include final answer
retry_policy:
  max_attempts: 1
  revise_on_failure: false
stop_rule:
  max_generations: 7
  min_delta: 0.03
  patience: 2
environment:
  workspace_layout: []
  required_artifacts: []
  artifact_purpose: {}
  file_templates: {}
  cleanup_policy: keep_run_artifacts
intra_test_reflection_enabled: false
max_intra_reflection_retries: 1
