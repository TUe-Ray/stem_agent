genome_version: 2
name: toy_structured_answer_zero_order_seed
scenario_name: toy_structured_answer
task_diagnosis:
  expected_task_solving_pattern: Interpret the vague request, extract key information,
    and generate a structured, actionable output without requesting further clarifications.
  initial_architecture_hypothesis: A pipeline combining natural language understanding
    modules with structured response generation components to translate vague inputs
    into structured JSON outputs.
  initial_evaluation_hypothesis: Output correctness can be evaluated by compliance
    with provided constraints and alignment with scenario requirements, prioritizing
    actionable structured answers over clarifications.
  likely_failure_modes:
  - Misinterpretation of vague instructions leading to irrelevant output
  - Asking clarification questions despite constraints
  - Producing unstructured or overly verbose responses
  likely_needed_capabilities:
  - Natural language understanding
  - Information extraction
  - Structured data formatting
  - Conciseness and relevance maintenance
  task_type: general structured response generation
roles:
- name: solver
  description: Fresh task solver created without relying on the prior genome shape.
  instructions: Solve the problem from the scenario description. Show useful intermediate
    work and give the final answer.
  allowed_tools:
  - call_model
workflow:
- id: solve_from_scratch
  role: solver
  action: Solve the task from scratch using the scenario input and fixed evaluation
    criteria.
  input_from: []
  output_key: final_output
tools:
  builtin:
  - call_model
  generated: []
memory:
  schema:
    notes: string
  type: ephemeral
quality_gates: []
self_evaluation:
  enabled: true
  rubric:
  - Must include a short summary
  - Must include concrete steps
  - Must include final answer
retry_policy:
  max_attempts: 1
  revise_on_failure: false
stop_rule:
  max_generations: 7
  min_delta: 0.03
  patience: 2
environment:
  workspace_layout: []
  required_artifacts: []
  artifact_purpose: {}
  file_templates: {}
  cleanup_policy: keep_run_artifacts
intra_test_reflection_enabled: false
max_intra_reflection_retries: 1
