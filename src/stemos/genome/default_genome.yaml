genome_version: 0
name: "stem_seed"
scenario_name:
task_diagnosis: {}

roles:
  - name: "Founder"
    description: "A general-purpose problem solver."
    instructions: "Solve the task directly and return a useful answer."
    allowed_tools:
      - "call_model"

workflow:
  - id: "understand_task"
    role: "Founder"
    action: "Read the task input and identify what is being asked."
    input_from: []
    output_key: "understanding"
  - id: "solve_task"
    role: "Founder"
    action: "Produce the final output."
    input_from:
      - "understanding"
    output_key: "final_output"

tools:
  builtin:
    - "call_model"
  generated: []

memory:
  type: "ephemeral"
  schema:
    notes: "string"

quality_gates: []

self_evaluation:
  enabled: false
  rubric: []

retry_policy:
  max_attempts: 1
  revise_on_failure: false

stop_rule:
  max_generations: 5
  patience: 2
  min_delta: 0.03

environment:
  workspace_layout: []
  required_artifacts: []
  artifact_purpose: {}
  file_templates: {}
  cleanup_policy: "keep_run_artifacts"
