genome_version: 0
name: toy_structured_answer_seed
scenario_name: toy_structured_answer
task_diagnosis:
  task_type: general structured response generation
  expected_task_solving_pattern: Interpret vague request, map it to structured format,
    generate clear, actionable structured output
  likely_failure_modes:
  - Misinterpretation of vague request
  - Overly verbose or unstructured responses
  - Asking unnecessary clarifying questions
  - Failure to produce actionable output
  likely_needed_capabilities:
  - Natural language understanding
  - Information structuring
  - Conciseness and clarity in output
  - Knowledge of JSON schema and formatting
  initial_architecture_hypothesis: A natural language understanding module followed
    by a structured output generator that maps extracted intent and constraints into
    JSON format
  initial_evaluation_hypothesis: Evaluate correctness and usefulness of structured
    output against scenario constraints and clarity of actionable items
roles:
- name: Founder
  description: A general-purpose problem solver.
  instructions: Solve the task directly and return a useful answer.
  allowed_tools:
  - call_model
workflow:
- id: understand_task
  role: Founder
  action: Read the task input and identify what is being asked.
  input_from: []
  output_key: understanding
- id: solve_task
  role: Founder
  action: Produce the final output.
  input_from:
  - understanding
  output_key: final_output
tools:
  builtin:
  - call_model
  generated: []
memory:
  type: ephemeral
  schema:
    notes: string
quality_gates: []
self_evaluation:
  enabled: false
  rubric: []
retry_policy:
  max_attempts: 1
  revise_on_failure: false
stop_rule:
  max_generations: 7
  patience: 2
  min_delta: 0.03
environment:
  workspace_layout: []
  required_artifacts: []
  artifact_purpose: {}
  file_templates: {}
  cleanup_policy: keep_run_artifacts
intra_test_reflection_enabled: false
max_intra_reflection_retries: 1
